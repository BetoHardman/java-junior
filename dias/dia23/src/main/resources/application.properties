spring.main.banner-mode=off
logging.level.root=WARN

# 400 de validacao e resposta esperada, nao defeito do servidor.
logging.level.org.springframework.web.servlet=ERROR

# o formato padrao de erro (ProblemDetail) ficou DESLIGADO hoje:
# quem responde erro de validacao agora e o TratadorDeErros.
# ligado, ele vem antes e ganha do nosso.

# NOVIDADE DO DIA 23: o banco virou ARQUIVO.
#   mem   -> some ao desligar
#   file  -> fica em dias/dia23/dados/leads.mv.db
# TODO-1: troque "mem:leads" por "file:./dados/leads"
spring.datasource.url=jdbc:h2:mem:leads

# create-drop apagava tudo ao desligar. update mantem os dados e so
# ajusta a estrutura da tabela quando a classe muda.
# TODO-2: troque "create-drop" por "update"
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
