# BANCO SEPARADO PRO TESTE.
# O programa de verdade grava em arquivo (dias/dia24/dados/).
# O teste NAO pode usar esse banco: ele encontraria os leads da ultima
# vez que voce rodou, e o resultado mudaria a cada execucao.
#
# Aqui o banco e em memoria e nasce vazio toda vez. Mesmo estado, sempre.
spring.datasource.url=jdbc:h2:mem:teste
spring.jpa.hibernate.ddl-auto=create-drop

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.web.servlet=ERROR
spring.jpa.open-in-view=false
