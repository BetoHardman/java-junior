spring.main.banner-mode=off
logging.level.root=WARN

# 400 de validacao e resposta esperada, nao defeito do servidor:
# nao precisa de aviso no log.
logging.level.org.springframework.web.servlet=ERROR

# resposta de erro no formato RFC 7807 (ProblemDetail), sem timestamp
spring.mvc.problemdetails.enabled=true
