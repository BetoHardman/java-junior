spring.main.banner-mode=off
logging.level.root=WARN

# 400 de validacao e resposta esperada, nao defeito do servidor.
logging.level.org.springframework.web.servlet=ERROR

# o formato padrao de erro (ProblemDetail) ficou DESLIGADO hoje:
# quem responde erro de validacao agora e o TratadorDeErros.
# ligado, ele vem antes e ganha do nosso.

# NOVIDADE: o banco. H2 rodando na memoria do proprio programa.
spring.datasource.url=jdbc:h2:mem:leads
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
